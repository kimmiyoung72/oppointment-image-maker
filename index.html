<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#63D6D2"><link rel="manifest" href="manifest.webmanifest">
<title>수채화 약속 안내</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#EFFBFA;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#222}
.wrap{max-width:760px;margin:auto;padding:16px 14px 40px}.card{background:#fff;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 7px 24px #10676e17}
h1{margin:4px 0 5px;font-size:26px}.lead,.tip{color:#68797A;font-size:14px;line-height:1.5}
label{display:block;font-size:14px;font-weight:800;margin:12px 0 6px}
input,textarea{width:100%;padding:13px;border:1px solid #D8EEEC;border-radius:14px;font-size:16px}textarea{min-height:80px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,a.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;text-align:center;text-decoration:none;font-size:16px;font-weight:900}
.primary{margin-top:14px;background:linear-gradient(90deg,#16B7CF,#0BA8CF);color:#fff}.secondary{margin-top:9px;background:#E7F7F6;color:#126F78}
#preview{display:none;width:100%;border-radius:16px;box-shadow:0 10px 28px #0003}
.notice{margin-top:10px;background:#E9FAF8;color:#286A6B;padding:11px;border-radius:12px;font-size:14px}canvas{display:none}
@media(max-width:430px){.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>수채화 약속 안내</h1><p class="lead">올려주신 이미지 감성처럼 약속 안내장을 자동으로 만듭니다.</p>
<div class="card">
<label>고객명</label><input id="name" placeholder="예: 김영수 고객님">
<div class="row"><div><label>날짜</label><input id="date" type="date"></div><div><label>시간</label><input id="time" type="time" value="11:00"></div></div>
<label>장소</label><input id="place" placeholder="예: 고객님 자택">
<label>상담 내용</label><input id="purpose" value="보험 보장분석 및 제안서 설명">
<label>안내 문구</label><textarea id="memo">약속시간에 맞춰 찾아뵙겠습니다.
변경 필요 하시면 편하게 연락주세요.</textarea>
<div class="row"><div><label>담당자</label><input id="manager" value="김미영 팀장"></div><div><label>연락처</label><input id="phone" value="010-4899-4855"></div></div>
<button id="make" class="primary">수채화 이미지 만들기</button><div id="status" class="notice">내용을 입력한 뒤 버튼을 눌러주세요.</div>
</div>
<div class="card"><img id="preview"><a id="download" class="btn secondary" style="display:none">PNG 저장</a><button id="share" class="secondary" style="display:none">카카오톡 등으로 공유</button><p class="tip">휴대폰에서는 공유 버튼을 누르면 카카오톡을 선택할 수 있습니다.</p></div>
<canvas id="canvas" width="1080" height="1080"></canvas></div>
<script>
const $=id=>document.getElementById(id),bg=new Image();bg.src="watercolor-bg.png";
const pad=n=>String(n).padStart(2,"0");
function today(){let d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function fd(v){if(!v)return"날짜 미정";let [y,m,d]=v.split("-").map(Number),x=new Date(y,m-1,d),ds=["일","월","화","수","목","금","토"];return`${y}년 ${m}월 ${d}일 ${ds[x.getDay()]}요일`}
function ft(v){if(!v)return"시간 미정";let [h,m]=v.split(":").map(Number),ap=h<12?"오전":"오후";h=h%12||12;return`${ap} ${h}시${m?` ${m}분`:""}`}
function fit(c,t,max,s,min,w=800){while(s>min){c.font=`${w} ${s}px Malgun Gothic`;if(c.measureText(t).width<=max)break;s-=2}return s}
function rr(c,x,y,w,h,r,f){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();c.fillStyle=f;c.fill()}
function makeImage(){
 let c=$("canvas"),x=c.getContext("2d");x.clearRect(0,0,1080,1080);x.drawImage(bg,0,0,1080,1080);x.textAlign="center";
 x.fillStyle="#159FE7";x.font="900 58px Malgun Gothic";x.fillText("약속안내",540,120);
 let name=$("name").value.trim()||"고객님",ns=fit(x,name,760,88,48,900);x.fillStyle="#0BB2CB";x.font=`900 ${ns}px Malgun Gothic`;x.fillText(name,540,320);
 let dt=`${fd($("date").value)} ${ft($("time").value)}`,ds=fit(x,dt,760,48,30,700);x.font=`700 ${ds}px Malgun Gothic`;x.fillText(dt,540,500);
 let place="장소 : "+($("place").value.trim()||"장소 미정"),ps=fit(x,place,760,45,28,700);x.font=`700 ${ps}px Malgun Gothic`;x.fillText(place,540,580);
 let purpose=$("purpose").value.trim()||"상담 일정",qs=fit(x,purpose,760,44,27,700);x.font=`700 ${qs}px Malgun Gothic`;x.fillText(purpose,540,660);
 x.fillStyle="#111";x.font="800 32px Malgun Gothic";let my=810;($("memo").value||"").split("\n").slice(0,2).forEach(line=>{x.fillText(line,540,my);my+=50});
 rr(x,110,910,860,105,52,"#0CB6D0");x.fillStyle="#fff";let footer=`${$("manager").value.trim()||"담당자"}   ${$("phone").value.trim()||""}`,fs=fit(x,footer,760,52,30,900);x.font=`900 ${fs}px Malgun Gothic`;x.fillText(footer,540,980);
 let data=c.toDataURL("image/png"),p=$("preview"),d=$("download"),s=$("share");p.src=data;p.style.display="block";d.href=data;d.download=`${$("date").value||"날짜미정"}_${name}_약속안내.png`;d.style.display=s.style.display="block";$("status").innerHTML="<b>이미지가 완성되었습니다.</b> 아래에서 저장하거나 공유하세요.";setTimeout(()=>p.scrollIntoView({behavior:"smooth"}),100)
}
$("make").onclick=()=>bg.complete?makeImage():bg.onload=makeImage;
$("share").onclick=()=>$("canvas").toBlob(async b=>{let f=new File([b],"약속안내.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"약속 안내"});else alert("PNG 저장 후 카카오톡에서 보내주세요.")});
$("date").value=today();if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
</script></body></html>
